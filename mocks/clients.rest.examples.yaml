apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: Clients API
  version: 1.0.0
operations:
  'GET /clients':
    roster:
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "clients": [
              {
                "client_id": "11111111-1111-4111-8111-111111111111",
                "name": "Alice Ahmed",
                "email": "alice@example.com",
                "phone": "+44 7700 900001",
                "address": "1 Park Lane, Cardiff",
                "notes": "Key under the plant pot",
                "created_at": "2026-10-01T09:00:00Z"
              },
              {
                "client_id": "77777777-7777-4777-8777-777777777777",
                "name": "Ben Brooks",
                "created_at": "2026-09-01T09:00:00Z"
              }
            ]
          }
  'POST /clients':
    added:
      request:
        headers:
          Content-Type: application/json
        body: |-
          {
            "name": "Alice Ahmed",
            "email": "alice@example.com",
            "phone": "+44 7700 900001",
            "address": "1 Park Lane, Cardiff",
            "notes": "Key under the plant pot"
          }
      response:
        status: "201"
        mediaType: application/json
        body: |-
          {
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Alice Ahmed",
            "email": "alice@example.com",
            "phone": "+44 7700 900001",
            "address": "1 Park Lane, Cardiff",
            "notes": "Key under the plant pot",
            "created_at": "2026-10-01T09:00:00Z"
          }
  'GET /clients/{client_id}':
    alice:
      request:
        parameters:
          client_id: 11111111-1111-4111-8111-111111111111
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Alice Ahmed",
            "email": "alice@example.com",
            "phone": "+44 7700 900001",
            "address": "1 Park Lane, Cardiff",
            "notes": "Key under the plant pot",
            "created_at": "2026-10-01T09:00:00Z"
          }
    not_found:
      request:
        parameters:
          client_id: 99999999-9999-4999-8999-999999999999
      response:
        status: "404"
        mediaType: application/json
        body: |-
          {
            "error_code": "client_not_found",
            "message": "No client 99999999-9999-4999-8999-999999999999"
          }
  'PATCH /clients/{client_id}':
    new_phone:
      request:
        parameters:
          client_id: 11111111-1111-4111-8111-111111111111
        headers:
          Content-Type: application/json
        body: |-
          {
            "phone": "+44 7700 900002"
          }
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Alice Ahmed",
            "email": "alice@example.com",
            "phone": "+44 7700 900002",
            "address": "1 Park Lane, Cardiff",
            "notes": "Key under the plant pot",
            "created_at": "2026-10-01T09:00:00Z"
          }
  'DELETE /clients/{client_id}':
    # A client of its own, so the replay order against a real service never
    # removes the one the other examples fetch.
    removed:
      request:
        parameters:
          client_id: 77777777-7777-4777-8777-777777777777
      response:
        status: "204"
  'GET /dogs':
    all_dogs:
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "dogs": [
              {
                "dog_id": "22222222-2222-4222-8222-222222222222",
                "client_id": "11111111-1111-4111-8111-111111111111",
                "name": "Biscuit",
                "breed": "Cockapoo",
                "date_of_birth": "2022-05-14",
                "notes": "Pulls on the lead near squirrels",
                "created_at": "2026-10-01T09:05:00Z"
              },
              {
                "dog_id": "88888888-8888-4888-8888-888888888888",
                "client_id": "11111111-1111-4111-8111-111111111111",
                "name": "Rex",
                "breed": "Labrador",
                "created_at": "2026-10-01T09:06:00Z"
              }
            ]
          }
  'POST /dogs':
    added:
      request:
        headers:
          Content-Type: application/json
        body: |-
          {
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Biscuit",
            "breed": "Cockapoo",
            "date_of_birth": "2022-05-14",
            "notes": "Pulls on the lead near squirrels"
          }
      response:
        status: "201"
        mediaType: application/json
        body: |-
          {
            "dog_id": "22222222-2222-4222-8222-222222222222",
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Biscuit",
            "breed": "Cockapoo",
            "date_of_birth": "2022-05-14",
            "notes": "Pulls on the lead near squirrels",
            "created_at": "2026-10-01T09:05:00Z"
          }
  'GET /dogs/{dog_id}':
    biscuit:
      request:
        parameters:
          dog_id: 22222222-2222-4222-8222-222222222222
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "dog_id": "22222222-2222-4222-8222-222222222222",
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Biscuit",
            "breed": "Cockapoo",
            "date_of_birth": "2022-05-14",
            "notes": "Pulls on the lead near squirrels",
            "created_at": "2026-10-01T09:05:00Z"
          }
    not_found:
      request:
        parameters:
          dog_id: 99999999-9999-4999-8999-999999999999
      response:
        status: "404"
        mediaType: application/json
        body: |-
          {
            "error_code": "dog_not_found",
            "message": "No dog 99999999-9999-4999-8999-999999999999"
          }
  'PATCH /dogs/{dog_id}':
    new_notes:
      request:
        parameters:
          dog_id: 22222222-2222-4222-8222-222222222222
        headers:
          Content-Type: application/json
        body: |-
          {
            "notes": "Now fine with squirrels"
          }
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "dog_id": "22222222-2222-4222-8222-222222222222",
            "client_id": "11111111-1111-4111-8111-111111111111",
            "name": "Biscuit",
            "breed": "Cockapoo",
            "date_of_birth": "2022-05-14",
            "notes": "Now fine with squirrels",
            "created_at": "2026-10-01T09:05:00Z"
          }
  'DELETE /dogs/{dog_id}':
    # A dog of its own (Alice's second dog), for the same reason.
    removed:
      request:
        parameters:
          dog_id: 88888888-8888-4888-8888-888888888888
      response:
        status: "204"
